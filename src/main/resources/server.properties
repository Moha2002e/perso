# Configuration Serveur Consultation
# ==================================

# Port d'écoute du serveur
PORT_CONSULTATION=8080

# Configuration Base de Données
DB_HOST=192.168.0.16
DB_NAME=PourStudent
DB_USER=Student
DB_PASSWORD=PassStudent1_
DB_DRIVER=com.mysql.cj.jdbc.Driver
DB_URL=jdbc:mysql://${DB_HOST}/${DB_NAME}

# Configuration Thread Pool
THREAD_POOL_SIZE=10
THREAD_POOL_MAX_SIZE=20
THREAD_POOL_QUEUE_SIZE=100
THREAD_KEEP_ALIVE_TIME=60

# Timeouts et Performance
SOCKET_TIMEOUT=30000
SOCKET_SO_TIMEOUT=10000
DB_CONNECTION_TIMEOUT=5000
DB_QUERY_TIMEOUT=10000

# Configuration Logging
LOG_LEVEL=INFO
LOG_THREAD_INFO=true
LOG_PERFORMANCE=true

# Configuration Arrêt
SHUTDOWN_TIMEOUT=30000
GRACEFUL_SHUTDOWN=true
